<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img">
<style>text{font-family:system-ui,sans-serif;fill:#17202a}.h{font-size:26px;font-weight:700}.t{font-size:20px}.box{fill:#f8f9f9;stroke:#34495e;stroke-width:3}.pin{fill:#fff;stroke:#34495e;stroke-width:3}.wire{fill:none;stroke-width:6}.warn{fill:#fff3cd;stroke:#b58105;stroke-width:2}</style>
<text x="500" y="42" text-anchor="middle" class="h">EasyBox 803A: UART nur mit 3,3-V-TTL</text>
<rect x="55" y="90" width="310" height="240" rx="18" class="box"/><text x="210" y="125" text-anchor="middle" class="h">USB-TTL-Adapter</text>
<text x="95" y="180" class="t">GND (schwarz)</text><circle cx="330" cy="173" r="15" class="pin"/>
<text x="95" y="235" class="t">RXD (grün)</text><circle cx="330" cy="228" r="15" class="pin"/>
<text x="95" y="290" class="t">TXD (weiß)</text><circle cx="330" cy="283" r="15" class="pin"/>
<rect x="635" y="90" width="310" height="240" rx="18" class="box"/><text x="790" y="125" text-anchor="middle" class="h">EasyBox UART</text>
<circle cx="670" cy="155" r="15" class="pin"/><text x="705" y="162" class="t">Pin 1: 3,3 V – offen</text>
<circle cx="670" cy="205" r="15" class="pin"/><text x="705" y="212" class="t">Pin 2: TX</text>
<circle cx="670" cy="255" r="15" class="pin"/><text x="705" y="262" class="t">Pin 3: RX</text>
<circle cx="670" cy="305" r="15" class="pin"/><text x="705" y="312" class="t">Pin 4: GND</text>
<path d="M345 173 C470 173 520 305 655 305" class="wire" stroke="#202020"/><path d="M345 228 C470 228 520 205 655 205" class="wire" stroke="#27ae60"/><path d="M345 283 C470 283 520 255 655 255" class="wire" stroke="#3498db"/>
<rect x="155" y="355" width="690" height="45" rx="8" class="warn"/><text x="500" y="384" text-anchor="middle" class="t">Keine VCC-Leitung anschließen. TX und RX werden gekreuzt verbunden.</text>
</svg>
